name: moder

services:
  mysql:
    image: mysql:9.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [moder_net]

  php:
    build:
      context: ./php
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MODER_TOKEN_AGENT: ${MODER_TOKEN_AGENT}
      MODER_TOKEN_MODER: ${MODER_TOKEN_MODER}
      MODER_TOKEN_DEVOPS: ${MODER_TOKEN_DEVOPS}
      MODER_UI_SECRET: ${MODER_UI_SECRET:-}
      MODER_UI_EMAIL_HOVER: ${MODER_UI_EMAIL_HOVER:-1}
      MODER_TZ: ${MODER_TZ:-Europe/Moscow}
    volumes:
      - ./www:/var/www/html:cached
    depends_on:
      mysql:
        condition: service_healthy
    networks: [moder_net]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/var/www/html:cached
      - ./logs/nginx:/var/log/nginx
    depends_on: [php]
    networks: [moder_net]

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PMA_PORT}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT}
      MEMORY_LIMIT: 256M
    volumes:
      - pma_sessions:/sessions
    depends_on:
      mysql:
        condition: service_healthy
    networks: [moder_net]

volumes:
  mysql_data:
  pma_sessions:

networks:
  moder_net:
    name: moder_net
