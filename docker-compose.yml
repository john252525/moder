name: moder

services:
  mysql:
    image: mysql:9.4
    restart: unless-stopped
    # Сервер на 1.7 ГБ + рядом mailcow: настраиваем MySQL экономно, иначе OOM-kill.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=8M
      - --innodb-flush-method=fsync
      - --performance-schema=OFF
      - --max-connections=30
      - --table-open-cache=64
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --key-buffer-size=8M
      - --thread-cache-size=8
      - --innodb-buffer-pool-instances=1
    mem_limit: 384m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [moder_net]

  php:
    build:
      context: ./php
    restart: unless-stopped
    mem_limit: 320m
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MODER_TOKEN_AGENT: ${MODER_TOKEN_AGENT}
      MODER_TOKEN_MODER: ${MODER_TOKEN_MODER}
      MODER_TOKEN_DEVOPS: ${MODER_TOKEN_DEVOPS}
      MODER_UI_SECRET: ${MODER_UI_SECRET:-}
      MODER_TZ: ${MODER_TZ:-Europe/Moscow}
    volumes:
      - ./www:/var/www/html:cached
    depends_on:
      mysql:
        condition: service_healthy
    networks: [moder_net]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    mem_limit: 96m
    ports:
      - "127.0.0.1:${NGINX_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/var/www/html:cached
      - ./logs/nginx:/var/log/nginx
    depends_on: [php]
    networks: [moder_net]

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    mem_limit: 160m
    ports:
      - "127.0.0.1:${PMA_PORT}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT}
      MEMORY_LIMIT: 256M
    volumes:
      - pma_sessions:/sessions
    depends_on:
      mysql:
        condition: service_healthy
    networks: [moder_net]

  mailer:
    build:
      context: ./mailer
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MODER_BASE: http://nginx:80
      MODER_TOKEN_DEVOPS: ${MODER_TOKEN_DEVOPS}
      MAILER_DRY_RUN: ${MAILER_DRY_RUN:-1}
      MAILER_MODE: ${MAILER_MODE:-batch}
      MAILER_DAILY_LIMIT: ${MAILER_DAILY_LIMIT:-5}
      MAILER_BATCH_SIZE: ${MAILER_BATCH_SIZE:-5}
      MAILER_WINDOW: ${MAILER_WINDOW:-09:00-18:00}
      MAILER_TZ: ${MAILER_TZ:-Europe/Moscow}
      MAILER_POLL_INTERVAL: ${MAILER_POLL_INTERVAL:-300}
      MAILER_MIN_GAP_SECONDS: ${MAILER_MIN_GAP_SECONDS:-0}
      MAILER_STATE_FILE: /data/state.json
      MAILER_ACCOUNTS: ${MAILER_ACCOUNTS:-}
      MAILER_SMTP_HOST: ${MAILER_SMTP_HOST:-smtp.mail.ru}
      MAILER_SMTP_PORT: ${MAILER_SMTP_PORT:-465}
      MAILER_SMTP_USER: ${MAILER_SMTP_USER:-}
      MAILER_SMTP_PASS: ${MAILER_SMTP_PASS:-}
      MAILER_FROM_NAME: ${MAILER_FROM_NAME:-}
      MAILER_LOG_LEVEL: ${MAILER_LOG_LEVEL:-info}
    volumes:
      - mailer_state:/data
    depends_on: [nginx]
    networks: [moder_net]

volumes:
  mysql_data:
  pma_sessions:
  mailer_state:

networks:
  moder_net:
    name: moder_net
