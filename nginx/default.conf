server {
    listen 80;
    server_name _;

    # Docker DNS: резолвим php динамически, иначе при пересоздании
    # php-контейнера nginx держит старый IP и отдаёт 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 128m;
    fastcgi_buffers 16 32k;
    fastcgi_buffer_size 64k;

    # --- Мобильный SPA (/m/) — изолированно, старый UI не трогаем ---
    # Снести: удалить www/public/m и этот блок.
    location /m/ {
        try_files $uri $uri/ /m/index.html;
        add_header Cache-Control "no-cache";
    }

    # phpMyAdmin (проксируется Caddy по /phpmyadmin, но и напрямую через отдельный порт работает)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known) { deny all; }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
